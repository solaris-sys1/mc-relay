name: Minecraft 26.2 SMP Relay Node

on:
  workflow_dispatch:
    inputs:
      cycle_count:
        description: 'Relay cycle counter'
        required: false
        default: '0'
        type: string
  repository_dispatch:
    types: [start-mc-relay]

jobs:
  minecraft-relay:
    name: Run Minecraft 26.2 SMP Server
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Set up Java 25 Runtime (Amazon Corretto)
        run: |
          wget -O - https://apt.corretto.aws/corretto.key | sudo gpg --dearmor -o /usr/share/keyrings/corretto-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/corretto-keyring.gpg] https://apt.corretto.aws stable main" | sudo tee /etc/apt/sources.list.d/corretto.list
          sudo apt-get update -qq
          sudo apt-get install -y java-25-amazon-corretto-jdk
          CORRETTO_JAVA=$(find /usr/lib/jvm/ -name "java" -path "*java-25*bin/java" | head -n 1)
          if [ -z "$CORRETTO_JAVA" ]; then
            CORRETTO_JAVA=$(which java)
          fi
          echo "Found Java 25 binary at: $CORRETTO_JAVA"
          sudo update-alternatives --set java "$CORRETTO_JAVA" || true
          JAVA_HOME_DIR=$(dirname $(dirname "$CORRETTO_JAVA"))
          echo "JAVA_HOME=$JAVA_HOME_DIR" >> $GITHUB_ENV
          echo "PATH=$JAVA_HOME_DIR/bin:$PATH" >> $GITHUB_ENV
          "$CORRETTO_JAVA" -version

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Compression Tools & Playit Agent
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zstd pigz jq curl
          echo "Installing Playit agent binary..."
          sudo curl -SsL -o /usr/local/bin/playit https://github.com/playit-cloud/playit-agent/releases/download/v1.0.10/playit-linux-amd64
          sudo chmod +x /usr/local/bin/playit
          playit --version || true

      - name: Predecessor Handshake & Port Cleanup
        env:
          PREV_PAT: ${{ secrets.PREV_PAT }}
        run: |
          REPOS=(
            "neon-drifter/mc-relay"
            "cloud-strider1/mc-relay"
            "rusty-quill/mc-relay"
            "solaris-sys1/mc-relay"
          )
          CURRENT_INDEX=-1
          for i in "${!REPOS[@]}"; do
            if [[ "${REPOS[$i]}" == "${GITHUB_REPOSITORY}" ]]; then
              CURRENT_INDEX=$i
              break
            fi
          done

          if [ $CURRENT_INDEX -ge 0 ]; then
            PREV_INDEX=$(( (CURRENT_INDEX - 1 + ${#REPOS[@]}) % ${#REPOS[@]} ))
            PREV_REPO="${REPOS[$PREV_INDEX]}"
            echo "Checking predecessor node: ${PREV_REPO}..."

            PREV_RUN_ID=$(GH_TOKEN="$PREV_PAT" gh run list --repo "$PREV_REPO" --status in_progress --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || echo "")

            if [ -n "$PREV_RUN_ID" ] && [ "$PREV_RUN_ID" != "null" ]; then
              echo "Active predecessor run detected: #${PREV_RUN_ID} on ${PREV_REPO}"
              echo "Gracefully terminating predecessor..."
              GH_TOKEN="$PREV_PAT" gh run cancel "$PREV_RUN_ID" --repo "$PREV_REPO" 2>/dev/null || true

              for sec in {1..20}; do
                RUN_STATUS=$(GH_TOKEN="$PREV_PAT" gh run view "$PREV_RUN_ID" --repo "$PREV_REPO" --json status -q '.status' 2>/dev/null || echo "completed")
                if [ "$RUN_STATUS" != "in_progress" ]; then
                  echo "Predecessor terminated cleanly in ${sec}s."
                  break
                fi
                sleep 2
              done
              sleep 3
            else
              echo "No active predecessor run detected on ${PREV_REPO}. Safe to proceed."
            fi
          fi

      - name: Clone Private Minecraft Server Repository
        env:
          CLONE_PAT: ${{ secrets.CLONE_PAT }}
        run: |
          git config --global user.name "Silver-kun"
          git config --global user.email "silver-kun@users.noreply.github.com"
          git clone https://${CLONE_PAT}@github.com/Silver-kun/minecraft-server.git server
          cd server
          mkdir -p plugins

      - name: Download Paper 26.2 Binary & Network Plugins
        run: |
          cd server
          USER_AGENT="silver-smp-runner/1.0 (admin@silver-kun.org)"

          # 1. Download PaperMC from Fill v3 API
          echo "Fetching latest Paper 26.2 build..."
          BUILDS_JSON=$(curl -s -H "User-Agent: $USER_AGENT" "https://fill.papermc.io/v3/projects/paper/versions/26.2/builds")
          PAPER_URL=$(echo "$BUILDS_JSON" | jq -r 'map(select(.channel == "STABLE")) | .[0].downloads."server:default".url' 2>/dev/null || echo "")

          if [ -z "$PAPER_URL" ] || [ "$PAPER_URL" == "null" ]; then
            echo "Falling back to 1.21.4 stable..."
            BUILDS_JSON=$(curl -s -H "User-Agent: $USER_AGENT" "https://fill.papermc.io/v3/projects/paper/versions/1.21.4/builds")
            PAPER_URL=$(echo "$BUILDS_JSON" | jq -r 'map(select(.channel == "STABLE")) | .[0].downloads."server:default".url')
          fi

          echo "Downloading Paper from: $PAPER_URL"
          curl -sL -H "User-Agent: $USER_AGENT" -o paper.jar "$PAPER_URL"
          ls -lh paper.jar

          # 2. Download Plugins (Minekube Connect, ViaVersion, ViaBackwards, TAB)
          echo "Downloading Minekube Connect plugin..."
          curl -sL "https://github.com/minekube/connect-java/releases/download/0.15.11/connect-spigot.jar" -o plugins/connect-spigot.jar

          echo "Downloading ViaVersion..."
          curl -sL "https://github.com/ViaVersion/ViaVersion/releases/download/5.11.0/ViaVersion-5.11.0.jar" -o plugins/ViaVersion.jar

          echo "Downloading ViaBackwards..."
          curl -sL "https://github.com/ViaVersion/ViaBackwards/releases/download/5.11.0/ViaBackwards-5.11.0.jar" -o plugins/ViaBackwards.jar

          echo "Downloading TAB plugin..."
          curl -sL "https://github.com/NEZNAMY/TAB/releases/download/6.1.3/TAB.v6.1.3.jar" -o plugins/TAB.jar

          ls -la plugins/

      - name: Restore World State from GitHub Releases
        env:
          CLONE_PAT: ${{ secrets.CLONE_PAT }}
        run: |
          cd server
          echo "Checking for latest world release..."

          # Attempt to download world-latest.tar.zst from private repo releases
          if GH_TOKEN="$CLONE_PAT" gh release download "world-latest" --repo "Silver-kun/minecraft-server" --pattern "world-latest.tar.zst" 2>/dev/null; then
            echo "World archive downloaded! Decompressing..."
            tar --zstd -xf world-latest.tar.zst
            rm -f world-latest.tar.zst
            echo "World state restored successfully."
          else
            echo "No prior world archive found. A pristine world will be generated."
          fi

      - name: Launch Minecraft Server via Supervisor
        env:
          PLAYIT_SECRET_KEY: ${{ secrets.PLAYIT_SECRET_KEY }}
        run: |
          cd server

          echo "================================================================"
          echo "Starting Playit TCP Tunnel..."
          echo "================================================================"
          if [ -n "$PLAYIT_SECRET_KEY" ]; then
            echo "Running Playit with configured secret key..."
            playit --secret "$PLAYIT_SECRET_KEY" run &
          else
            echo "Running Playit in claim mode (no secret key configured yet)..."
            playit run &
          fi
          PLAYIT_PID=$!

          # Give Playit 4 seconds to output claim link or connect
          sleep 4

          # Launch Minecraft Paper Server
          python -u supervisor.py

          # Terminate tunnel when server stops
          kill -9 $PLAYIT_PID 2>/dev/null || true

      - name: Archive & Upload World Snapshot to GitHub Releases
        if: always()
        env:
          CLONE_PAT: ${{ secrets.CLONE_PAT }}
        run: |
          cd server
          echo "Creating compressed world snapshot with zstd multithreading..."

          # Include world folders, playerdata, stats, advancements, and plugin states
          DIRS_TO_SAVE=""
          for d in world world_nether world_the_end plugins/TAB plugins/connect; do
            if [ -d "$d" ]; then
              DIRS_TO_SAVE="$DIRS_TO_SAVE $d"
            fi
          done

          if [ -n "$DIRS_TO_SAVE" ]; then
            tar --zstd -cf world-latest.tar.zst $DIRS_TO_SAVE
            echo "Created world-latest.tar.zst (Size: $(du -h world-latest.tar.zst | cut -f1))"

            # Create or update 'world-latest' tag in private repo releases
            echo "Uploading world snapshot to Silver-kun/minecraft-server releases..."
            GH_TOKEN="$CLONE_PAT" gh release delete "world-latest" --repo "Silver-kun/minecraft-server" -y 2>/dev/null || true
            git tag -d "world-latest" 2>/dev/null || true
            GH_TOKEN="$CLONE_PAT" gh release create "world-latest" world-latest.tar.zst \
              --repo "Silver-kun/minecraft-server" \
              --title "Automated World Snapshot" \
              --notes "Rolling atomic snapshot generated at $(date -u)"
            echo "World snapshot uploaded successfully!"
          fi

      - name: Automated Successor Handover
        if: always()
        env:
          NEXT_PAT: ${{ secrets.NEXT_PAT }}
          FALLBACK_PAT: ${{ secrets.FALLBACK_PAT }}
          CYCLE_COUNT: ${{ github.event.client_payload.cycle_count || github.event.inputs.cycle_count || '0' }}
        run: |
          REPOS=(
            "neon-drifter/mc-relay"
            "cloud-strider1/mc-relay"
            "rusty-quill/mc-relay"
            "solaris-sys1/mc-relay"
          )

          CURRENT_INDEX=-1
          for i in "${!REPOS[@]}"; do
            if [[ "${REPOS[$i]}" == "${GITHUB_REPOSITORY}" ]]; then
              CURRENT_INDEX=$i
              break
            fi
          done

          NEXT_INDEX=$(( (CURRENT_INDEX + 1) % ${#REPOS[@]} ))
          FALLBACK_INDEX=$(( (CURRENT_INDEX + 2) % ${#REPOS[@]} ))
          PRIMARY_TARGET="${REPOS[$NEXT_INDEX]}"
          FALLBACK_TARGET="${REPOS[$FALLBACK_INDEX]}"
          NEXT_CYCLE=$((CYCLE_COUNT + 1))

          echo "Triggering successor node: ${PRIMARY_TARGET} (Cycle #${NEXT_CYCLE})..."

          dispatch_runner() {
            local target="$1"
            local token="$2"
            for attempt in 1 2 3; do
              echo "Dispatch attempt $attempt to ${target}..."
              if GH_TOKEN="$token" gh api repos/"$target"/dispatches \
                -X POST \
                -f event_type="start-mc-relay" \
                -F "client_payload[cycle_count]=$NEXT_CYCLE" 2>/dev/null; then
                echo "Successfully triggered via repository_dispatch on ${target}."
                return 0
              fi

              if GH_TOKEN="$token" gh workflow run mc.yml \
                --repo "$target" \
                -f cycle_count="$NEXT_CYCLE" 2>/dev/null; then
                echo "Successfully triggered via workflow_dispatch on ${target}."
                return 0
              fi
              sleep 10
            done
            return 1
          }

          if dispatch_runner "$PRIMARY_TARGET" "$NEXT_PAT"; then
            echo "Primary successor triggered successfully."
          else
            echo "Primary dispatch failed. Engaging fallback: ${FALLBACK_TARGET}..."
            dispatch_runner "$FALLBACK_TARGET" "$FALLBACK_PAT" || echo "Fallback dispatch failed!"
          fi
